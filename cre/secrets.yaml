# ==========================================================================
# CRE SECRETS DECLARATION (names only — values come from .env at simulation)
# ==========================================================================
# This file DECLARES secret names. Values are resolved from `.env` (project
# root) or exported environment variables during `cre workflow simulate`.
# For deployed workflows the same names are resolved from the Vault DON.
#
#   receipts_bearer : Bearer token for the TokenShare relay `/receipt/{id}`
#                     endpoint (sent as `Authorization: Bearer <value>`).
#                     Leave empty/placeholder if your relay does not require
#                     auth — the workflow template includes it to demonstrate
#                     Confidential HTTP secret handling.
secretsNames:
  receipts_bearer:
    - RECEIPTS_BEARER_ALL
