# TokenShare seller relay — compose for Phala Cloud TDX CVMs (M7-A).
#
# Deploy (manual, needs your Phala account — see README-docker.md):
#   phala deploy -n tokenshare-relay -c docker-compose.yml -e .env -t tdx.small --wait
#
# Key points (per the M7 material):
#   - /var/run/dstack.sock MUST be mounted: the seller key is derived inside
#     the TEE via dstack get_key and /attestation serves the TDX quote.
#   - ports 8787 (inbound via https://<app-id>-8787.<gateway-domain>).
#   - env comes from .env (phala deploy -e .env injects it too). In TEE mode
#     RELAY_SELLER_KEY may stay unset — it is ignored.
services:
  relay:
    # Build context = repo root (the image embeds the Foundry ABI artifacts
    # from contracts/out/ — see relay/Dockerfile).
    build:
      context: ..
      dockerfile: relay/Dockerfile
    # Phala Cloud CVMs are Intel TDX (x86_64): force the platform so builds
    # made on Apple Silicon hosts produce an amd64 image.
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      # Not fatal when absent — the relay itself fails fast on missing
      # required vars (no degraded mode); `phala deploy -e .env` injects the
      # same file server-side.
      - path: .env
        required: false
    volumes:
      # TEE key derivation + attestation quotes (dstack guest agent socket).
      - /var/run/dstack.sock:/var/run/dstack.sock
    healthcheck:
      # python:3.12-slim has no curl/wget; use the stdlib one-liner.
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8787')+'/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # One-shot Registry registrar (M7-B). Runs in the SAME CVM as the relay and
  # mounts the SAME dstack socket: it derives the SAME TEE seller key the
  # relay uses and signs Registry.register/deactivate from inside the enclave
  # (the private key never leaves it). Required because the relay's key can
  # never be exported, yet the listing operator MUST equal the relay's
  # signing address or buyer signature checks fail.
  #
  # Env: REGISTRAR_* vars (endpoint/models/prices) + RPC_URL/CHAIN_ID/
  # REGISTRY_ADDR — injected via env_file/.env or `phala deploy -e .env`
  # (see relay/README-docker.md section "TEE on-chain registration").
  #
  # Runs once and exits (idempotent: an already-matching listing exits 0
  # immediately, so CVM restarts have no side effects). Local single run —
  # DEBUG ONLY (a laptop has no real dstack socket, the run fails fast):
  #   docker compose --profile register run --rm registrar
  # ---------------------------------------------------------------------------
  registrar:
    build:
      # Same image as the relay (repo-root context, relay/Dockerfile —
      # registrar.py is COPYed in and web3/dstack-sdk already installed).
      context: ..
      dockerfile: relay/Dockerfile
    platform: linux/amd64
    profiles:
      - register
    # One-shot: never auto-restart. On Phala Cloud the container runs once at
    # CVM boot; the idempotent already-OK fast exit keeps restarts harmless.
    restart: "no"
    command: ["python", "registrar.py"]
    env_file:
      # Same env source as the relay (extra REGISTRAR_* vars live here too).
      - path: .env
        required: false
    volumes:
      # Same TEE key source as the relay — derivation path
      # 'wallet/ethereum/tokenshare' is shared with relay/app/config.py.
      - /var/run/dstack.sock:/var/run/dstack.sock
